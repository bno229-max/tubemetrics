<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TubeMetrics · Análise de canais do YouTube</title>
  <meta name="description" content="Métricas de canais do YouTube com insights gerados por estatística — sem inteligência artificial. Análise pública gratuita e dashboard do criador com receita, CTR e retenção.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;680;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div id="app">
    <div style="display:grid;place-items:center;min-height:100vh;gap:14px">
      <div style="width:34px;height:24px;border-radius:8px;background:#ff0033;display:grid;place-items:center">
        <span style="width:0;height:0;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px"></span>
      </div>
      <p style="color:#79808f;font:14px/1.5 system-ui,sans-serif">Carregando TubeMetrics…</p>
    </div>
  </div>

  <noscript>
    <div style="max-width:520px;margin:80px auto;padding:24px;font:15px/1.6 system-ui,sans-serif;text-align:center">
      <h1 style="font-size:20px">JavaScript é necessário</h1>
      <p style="color:#4d5563">O TubeMetrics roda inteiramente no navegador — todos os cruzamentos estatísticos são
      calculados no seu dispositivo. Habilite o JavaScript para continuar.</p>
    </div>
  </noscript>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
